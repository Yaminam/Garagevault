<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A keyhole cut out of the accent tile. At 16px a padlock turns to mush,
    but a solid shape with one hole stays legible, and the hole reads as
    "locked" without needing a shackle.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9350" />
      <stop offset="1" stop-color="#ef6a1c" />
    </linearGradient>
    <mask id="keyhole">
      <rect width="32" height="32" fill="#fff" />
      <circle cx="16" cy="13.5" r="4.1" fill="#000" />
      <path d="M13.9 16h4.2l1.5 7.6a1.3 1.3 0 0 1-1.28 1.55h-4.64A1.3 1.3 0 0 1 12.4 23.6Z" fill="#000" />
    </mask>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#tile)" mask="url(#keyhole)" />
</svg>
